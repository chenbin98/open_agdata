name: Correct a resource or report an access change
description: Report parameter, licence, version, URL or availability issues
title: '[Correction] '
body:
  - type: input
    id: resource
    attributes:
      label: Resource ID or URL
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problem and reproduction steps
      description: Include date, page/API route and the error or conflicting information. Do not include credentials or personal account information.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Suggested correction and official evidence
      description: Link a formal migration notice, new DOI or licence update if available.
