name: 修正资源或报告访问变化
description: 报告参数、许可、版本、失效链接或数据可用性问题
title: '[修正] '
body:
  - type: input
    id: resource
    attributes:
      label: 资源 ID 或链接
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题与复现方式
      description: 请说明日期、页面/接口、错误或冲突内容；不要填写密码、令牌或个人账户信息。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 建议修正与官方证据
      description: 如有正式迁移说明、新版 DOI 或许可变更，请提供出处。
