name: Suggest a public data resource
description: Add an agriculture, remote-sensing or environmental dataset, network or platform
title: '[Resource] '
body:
  - type: input
    id: name
    attributes:
      label: Resource name and provider
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Official entry point, DOI and version
      description: Link a formal release page rather than a temporary download URL.
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Variables, coverage and resolution
      description: Distinguish observations, statistics, remote sensing and model estimates. State unknowns.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Access conditions and data licence
      description: Does access require an account, key, payment or application? Link the licence or state that it is unchecked.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and experience
      description: Which primary sources did you read? Did you download data? What limitations remain?
    validations:
      required: true
